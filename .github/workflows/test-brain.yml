name: Test brain service
on:
  push:
    paths: ['brain/**', 'market/src/brain.mjs', 'market/src/worker.js', 'tests/brain-worker.test.mjs', 'tests/market-worker.test.mjs', 'tests/extract.mjs', '.github/workflows/test-brain.yml']
  pull_request:
    paths: ['brain/**', 'market/src/brain.mjs', 'market/src/worker.js', 'tests/brain-worker.test.mjs', 'tests/market-worker.test.mjs', 'tests/extract.mjs', '.github/workflows/test-brain.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r brain/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: brain
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/brain-worker.test.mjs tests/market-worker.test.mjs
        env:
          BRAIN_TESTS_REQUIRE_SQLITE: '1'
